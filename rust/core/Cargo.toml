[package]
name = "eav7-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "EAV7 Core — CLI de operador: init, status, modos e stake/score (Fases A+B) sobre eav7-node + SDK."
license = "MIT"

[[bin]]
name = "eav7-core"
path = "src/main.rs"

[features]
default = []
testnet = ["eav7/testnet"]

[dependencies]
eav7 = { path = ".." }
eav7-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
